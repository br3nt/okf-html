version: 1
source_tests:
  - okf-html/test/okf/document_test.rb
  - okf-html/test/okf/repository_test.rb
  - okf-html/test/okf/index_test.rb
cases:
  - name: identity_tags_timestamps
    input:
      uuid: "11111111-1111-4111-8111-111111111111"
      slug: my-note
      title: My Note
      effective_title: My Note
      created_at: "2026-01-01T12:00:00Z"
      updated_at: "2026-01-02T09:30:00Z"
      tag_names:
        - ruby
        - notes
      pinned: false
      template: false
      content: "<p>body</p>"
      metadata: []
      links: []
      associations: []
      rev_links: []
    expected_html: |
      <!DOCTYPE html>
      <html lang="en">
      <head profile="https://br3nt.github.io/okf/">
      <meta charset="utf-8">
      <title>My Note</title>
      <link rel="canonical" href="/n/my-note">
      <meta name="uuid" scheme="UUID" content="11111111-1111-4111-8111-111111111111">
      <meta name="created" scheme="ISO8601" content="2026-01-01T12:00:00Z">
      <meta name="updated" scheme="ISO8601" content="2026-01-02T09:30:00Z">
      <meta name="keywords" content="ruby, notes">
      </head>
      <body>
      <p>body</p>
      </body>
      </html>

  - name: metadata_links_flags_association
    input:
      uuid: "22222222-2222-4222-8222-222222222222"
      slug: research-note
      title: Research Note
      effective_title: Research Note
      created_at: "2026-02-03T04:05:06Z"
      updated_at: "2026-02-04T05:06:07Z"
      tag_names: []
      pinned: true
      template: true
      template_uuid: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      content: "<article><h1>Research Note</h1></article>"
      metadata:
        - name: author
          value: Jane
          scheme: DC
        - name: identifier
          value: "10.1234/abcd"
          scheme: DOI
      links:
        - rel: license
          href: /n/cc-by
      associations:
        - kind: has-many
          template_href: /templates/chapter
          template_uuid:
          as: chapter
          inverse: belongs-to
          dependent: destroy
          through:
          ordered: true
          optional: true
          polymorphic: false
      rev_links: []
    expected_html: |
      <!DOCTYPE html>
      <html lang="en">
      <head profile="https://br3nt.github.io/okf/">
      <meta charset="utf-8">
      <title>Research Note</title>
      <link rel="canonical" href="/n/research-note">
      <meta name="uuid" scheme="UUID" content="22222222-2222-4222-8222-222222222222">
      <meta name="created" scheme="ISO8601" content="2026-02-03T04:05:06Z">
      <meta name="updated" scheme="ISO8601" content="2026-02-04T05:06:07Z">
      <meta name="pinned" content="true">
      <meta name="template" content="true">
      <meta name="author" scheme="DC" content="Jane">
      <meta name="identifier" scheme="DOI" content="10.1234/abcd">
      <link rel="license" href="/n/cc-by">
      <link rel="okf:has-many" href="/templates/chapter" data-as="chapter" data-inverse="belongs-to" data-dependent="destroy" data-ordered="true">
      <meta name="instance-of" scheme="UUID" content="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa">
      </head>
      <body>
      <article><h1>Research Note</h1></article>
      </body>
      </html>

  - name: rev_mirror
    input:
      uuid: "33333333-3333-4333-8333-333333333333"
      slug: guide
      title: Guide
      effective_title: Guide
      created_at:
      updated_at:
      tag_names: []
      pinned: false
      template: false
      content: "<p>the guide</p>"
      metadata: []
      links: []
      associations: []
      rev_links:
        - rel: chapter
          source_slug: chapter-one
    expected_html: |
      <!DOCTYPE html>
      <html lang="en">
      <head profile="https://br3nt.github.io/okf/">
      <meta charset="utf-8">
      <title>Guide</title>
      <link rel="canonical" href="/n/guide">
      <meta name="uuid" scheme="UUID" content="33333333-3333-4333-8333-333333333333">
      <link rev="chapter" href="/n/chapter-one">
      </head>
      <body>
      <p>the guide</p>
      </body>
      </html>

  - name: effective_title_from_body
    input:
      uuid: "44444444-4444-4444-8444-444444444444"
      slug: first-line-from-body
      title:
      effective_title: First line from body
      created_at:
      updated_at:
      tag_names: []
      pinned: false
      template: false
      content: "<p>First line from body</p><p>More.</p>"
      metadata: []
      links: []
      associations: []
      rev_links: []
    expected_html: |
      <!DOCTYPE html>
      <html lang="en">
      <head profile="https://br3nt.github.io/okf/">
      <meta charset="utf-8">
      <title>First line from body</title>
      <link rel="canonical" href="/n/first-line-from-body">
      <meta name="uuid" scheme="UUID" content="44444444-4444-4444-8444-444444444444">
      </head>
      <body>
      <p>First line from body</p><p>More.</p>
      </body>
      </html>
